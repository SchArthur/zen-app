services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pfr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pfr}
      POSTGRES_DB: ${POSTGRES_DB:-pfr}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pfr} -d ${POSTGRES_DB:-pfr}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
