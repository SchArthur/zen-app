services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pfr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pfr}
      POSTGRES_DB: ${POSTGRES_DB:-pfr}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pfr} -d ${POSTGRES_DB:-pfr}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Serveur SMTP de développement : capture les mails sans jamais les envoyer.
  # Interface web sur http://localhost:8025 pour lire les liens de confirmation.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  db_data:
